name: Verificaciones

on:
  push:
    branches: [main, adrian, cristo]
  pull_request:
    branches: [main, adrian, cristo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API NestJS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      API_PORT: '3000'
      # Credenciales y llaves exclusivas de la base efímera de CI.
      DATABASE_OWNER_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      DATABASE_URL: postgresql://accesos_api:solo_para_ci_0123456789@localhost:5432/ci?schema=public
      TOTP_ENCRYPTION_KEY: Y2ktc29sby1wcnVlYmFzLTMyLWJ5dGVzLWV4YWN0b3M=
      BIOMETRIC_ENCRYPTION_KEY: Y2ktYmlvbWV0cmlhLXBydWViYXMtMzItYnl0ZXMtb2s=
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma generate
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run db:prepare
      - run: pnpm run test:e2e
      - run: pnpm run build
