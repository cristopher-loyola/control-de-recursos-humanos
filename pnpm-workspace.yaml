packages:
  - apps/*
  - packages/*
overrides:
  # Ajuste temporal: OXC 0.150.0 fija emnapi alpha.3, incompatible con runtime 1.2.6.
  '@oxc-parser/binding-wasm32-wasi@0.150.0>@napi-rs/wasm-runtime': 1.2.2
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  prisma: true
minimumReleaseAgeExclude:
  - '@angular-devkit/architect@0.2202.5'
  - '@angular-devkit/core@22.2.5'
  - '@angular-devkit/schematics@22.2.5'
  - '@angular/build@22.2.5'
  - '@angular/cli@22.2.5'
  - '@schematics/angular@22.2.5'
